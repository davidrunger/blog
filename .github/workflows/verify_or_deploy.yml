on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify_or_deploy:
    concurrency:
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      group: verify_or_deploy-${{ github.ref_name }}
    runs-on: ubuntu-latest
    name: Verify deployability (and maybe deploy)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version-file: .node-version

      - name: Install Gems
        run: bundle install

      - name: Run RuboCop
        run: bin/rubocop --format clang

      - name: Check post filenames
        run: bin/check-post-filenames

      - name: Check post images
        run: bin/check-post-images
        env:
          POST_IMAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Install JavaScript Packages
        run: pnpm install

      - name: Build
        run: bin/bridgetown deploy
        env:
          BRIDGETOWN_ENV: production

      - name: Check compiled CSS
        run: bin/check-compiled-css

      - name: Move 'output/' to 'blog/'
        run: mv output blog

      - name: Launch server
        run: python3 -m http.server 3000 --bind 127.0.0.1 --directory . > /dev/null 2>&1 &


      - name: Set PERCY_BROWSER_EXECUTABLE to system Chrome
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable)
          echo "PERCY_BROWSER_EXECUTABLE=$CHROME_PATH" >> $GITHUB_ENV
          echo "Using Chrome at $CHROME_PATH"
          $CHROME_PATH --version

      - name: Take Percy snapshots
        run: ./node_modules/.bin/percy snapshot snapshots.yml
        env:
          PERCY_TOKEN: '${{secrets.PERCY_TOKEN}}'

      - name: Deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/deploy
        with:
          SERVER_USER_AND_IP: ${{ secrets.SERVER_USER_AND_IP }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
