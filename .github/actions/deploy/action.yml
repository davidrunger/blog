name: "Deploy"
description: "Deploy to Rails server"
inputs:
  SERVER_USER_AND_IP:
    description: 'Server user and IP (e.g. "david@123.123.123.123")'
    required: true
  SSH_KNOWN_HOSTS:
    description: 'Known hosts file content with the server information'
    required: true
  SSH_PRIVATE_KEY:
    description: 'ED25519 SSH private key for deployment'
    required: true
  SSH_PUBLIC_KEY:
    description: 'Public key corresponding to SSH_PRIVATE_KEY'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up key for SSHing to server
      shell: bash
      run: |
        mkdir -p ~/.ssh/
        echo "${{ inputs.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
        echo "${{ inputs.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        echo "${{ inputs.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
        sudo chmod 600 ~/.ssh/id_ed25519
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_ed25519

    - name: Stage new 'blog/' directory on server
      shell: bash
      env:
        BLOG_DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        ssh "${{ inputs.SERVER_USER_AND_IP }}" \
          "rm -rf /root/david_runger-blog-deploys/${BLOG_DEPLOY_ID} && \
            mkdir -p /root/david_runger-blog-deploys/${BLOG_DEPLOY_ID}"
        scp -r blog \
          "${{ inputs.SERVER_USER_AND_IP }}:/root/david_runger-blog-deploys/${BLOG_DEPLOY_ID}/"

    - name: Publish staged files in place
      shell: bash
      env:
        BLOG_DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        ssh "${{ inputs.SERVER_USER_AND_IP }}" \
          "BLOG_DEPLOY_ID='${BLOG_DEPLOY_ID}' bash -s" \
          < bin/deploy/publish-staged-blog
